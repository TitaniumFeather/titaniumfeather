<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="240" viewBox="0 0 1100 240" role="img" aria-label="heatmap.svg">
    <style>
      .enter { animation: rise .75s cubic-bezier(.2,.8,.2,1) both; }
      .fade { animation: fade .9s ease both; }
      .pulse { animation: pulse 3s ease-in-out infinite; }
      .shine { animation: shine 6s linear infinite; }
      @keyframes rise { from { opacity:0; transform:translateY(17px) } to { opacity:1; transform:translateY(0) } }
      @keyframes fade { from { opacity:0 } to { opacity:1 } }
      @keyframes pulse { 0%,100% { opacity:.35 } 50% { opacity:1 } }
      @keyframes shine { 0%,65% { opacity:.12 } 80% { opacity:.8 } 100% { opacity:.12 } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none!important; transition:none!important; opacity:1!important; } }
    </style><rect x="1" y="1" width="1098" height="238" rx="20" fill="#0B101B" stroke="#283B55" /><rect x="25" y="24" width="9" height="9" rx="5" fill="#FF7272"  /><rect x="42" y="24" width="9" height="9" rx="5" fill="#F5C76D"  /><rect x="59" y="24" width="9" height="9" rx="5" fill="#63D9AC"  /><text x="85" y="33" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#94ABC6" font-weight="600" >contribution_matrix / last 365 days</text><text x="1074" y="33" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#65B8FF" font-weight="500" text-anchor="end">AWAITING API DATA</text><path d="M25 50 H1075" stroke="#283B55"/><text x="42" y="125" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" fill="#94ABC6" font-weight="400" >Contribution calendar unavailable — configure GH_TOKEN in GitHub Actions.</text></svg>