<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 365" width="1200" height="365" role="img" aria-label="project-4.svg"><style>
    .portrait-appear{animation:portrait-enter 1.6s ease-out both}.ascii-pixel{opacity:0;animation:pixel-in .45s steps(2,end) both}
    .hero-name{animation:name-rise 1.25s cubic-bezier(.16,1,.3,1) both}
    .reveal{animation:reveal 1.05s cubic-bezier(.2,.75,.2,1) both}
    .draw{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 3.2s cubic-bezier(.3,.6,.3,1) forwards}
    .trace{stroke-dasharray:18 12;animation:trace 16s linear infinite}
    .cube{transform-box:fill-box;transform-origin:center;animation:cube-float 8s ease-in-out infinite alternate}
    .glow{animation:glow 4s ease-in-out infinite}.scan{animation:scan 4s ease-in-out infinite}.float{animation:float 6s ease-in-out infinite}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3s ease-in-out infinite}
    @keyframes portrait-enter{from{opacity:0;filter:brightness(2)}to{opacity:.92;filter:brightness(1)}}
    @keyframes pixel-in{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:translateY(0)}}
    @keyframes name-rise{from{opacity:0;transform:translateY(115px) skewY(3deg)}to{opacity:1;transform:translateY(0) skewY(0)}}
    @keyframes reveal{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:translateY(0)}}
    @keyframes draw{to{stroke-dashoffset:0}}@keyframes trace{to{stroke-dashoffset:-360}}
    @keyframes cube-float{0%{transform:translate(0,0) rotate(-3deg)}100%{transform:translate(8px,-17px) rotate(6deg)}}
    @keyframes pulse{50%{opacity:.25;transform:scale(2.8)}}
    @keyframes glow{50%{opacity:.3}}@keyframes scan{0%,100%{transform:translateY(0)}50%{transform:translateY(125px)}}@keyframes float{50%{transform:translateY(-7px)}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;stroke-dashoffset:0!important;opacity:1!important}}
    </style><rect x="0" y="0" width="1200" height="365" rx="0" fill="#080A0B" stroke="none" /><rect x="16" y="8" width="1168" height="349" rx="12" fill="#101415" stroke="#293034" /><text x="44" y="56" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="13" font-weight="600" letter-spacing="2" fill="#D7B54A" >04 / PRODUCTS</text><g class="reveal" style="animation-delay:.1s"><text x="42" y="135" font-family="'Arial Narrow',Impact,'DejaVu Sans',sans-serif" font-size="56" font-weight="800" letter-spacing="-2" fill="#F1EEE5" >PixelPerfect</text></g><text x="45" y="186" font-family="'Arial Narrow',Impact,'DejaVu Sans',sans-serif" font-size="18" font-weight="400" letter-spacing="0" fill="#A3A39A" >From a blank canvas to something people actually use.</text><path d="M45 225 H555" fill="none" stroke="#293034" stroke-width="1" /><text x="45" y="265" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="13" font-weight="500" letter-spacing="1" fill="#19A9D1" >JAVASCRIPT / REACT / WEB</text><text x="45" y="321" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="15" font-weight="600" letter-spacing="1" fill="#D7B54A" >EXPLORE PROJECT  ↗</text><g class="reveal" style="animation-delay:.35s"><rect x="670" y="74" width="445" height="245" rx="9" fill="#0C171B" stroke="#19A9D1" /><rect x="670" y="74" width="445" height="29" rx="9" fill="#16272C" stroke="none" /><circle cx="690" cy="89" r="4" fill="#D7B54A"/><circle cx="705" cy="89" r="4" fill="#19A9D1"/><circle cx="720" cy="89" r="4" fill="#A3A39A"/><rect x="690" y="120" width="405" height="83" rx="4" fill="#17282C" stroke="none" /><rect x="707" y="141" width="186" height="12" rx="3" fill="#F1EEE5" stroke="none" /><rect x="707" y="162" width="125" height="8" rx="3" fill="#D7B54A" stroke="none" /><rect x="690" y="218" width="122" height="81" rx="4" fill="#12252C" stroke="none" /><rect x="823" y="218" width="122" height="81" rx="4" fill="#172F37" stroke="none" /><rect x="956" y="218" width="139" height="81" rx="4" fill="#12252C" stroke="none" /><path d="M977 261 L1003 237 L1029 261 L1052 245 L1080 261" fill="none" stroke="#19A9D1" stroke-width="2" class="draw"/></g></svg>