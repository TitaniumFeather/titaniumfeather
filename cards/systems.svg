<svg xmlns="http://www.w3.org/2000/svg" width="360" height="215" viewBox="0 0 360 215" role="img" aria-label="systems.svg">
    <style>
      .enter { animation: rise .75s cubic-bezier(.2,.8,.2,1) both; }
      .fade { animation: fade .9s ease both; }
      .pulse { animation: pulse 3s ease-in-out infinite; }
      .shine { animation: shine 6s linear infinite; }
      @keyframes rise { from { opacity:0; transform:translateY(17px) } to { opacity:1; transform:translateY(0) } }
      @keyframes fade { from { opacity:0 } to { opacity:1 } }
      @keyframes pulse { 0%,100% { opacity:.35 } 50% { opacity:1 } }
      @keyframes shine { 0%,65% { opacity:.12 } 80% { opacity:.8 } 100% { opacity:.12 } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none!important; transition:none!important; opacity:1!important; } }
    </style><rect x="1" y="1" width="358" height="213" rx="17" fill="#111C2D" stroke="#283B55" /><rect x="24" y="24" width="37" height="4" rx="2" fill="#65B8FF"  /><text x="24" y="58" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#65B8FF" font-weight="600" >01 / SYSTEMS</text><g class="enter" style="animation-delay:.3s"><text x="24" y="107" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" fill="#F2F6FF" font-weight="750" >ENGINEER</text></g><text x="24" y="151" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#94ABC6" font-weight="400" >Linux · Automation · C++</text><text x="24" y="185" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#94ABC6" font-weight="400" >Architecture and low-level tooling</text><circle cx="326" cy="37" r="13" fill="none" stroke="#65B8FF" stroke-width="2" class="pulse"/></svg>