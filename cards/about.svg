<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 365" width="1200" height="365" role="img" aria-label="about.svg"><style>
    .portrait-appear{animation:portrait-enter 1.6s ease-out both}.ascii-pixel{opacity:0;animation:pixel-in .45s steps(2,end) both}
    .hero-name{animation:name-rise 1.25s cubic-bezier(.16,1,.3,1) both}
    .reveal{animation:reveal 1.05s cubic-bezier(.2,.75,.2,1) both}
    .draw{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 3.2s cubic-bezier(.3,.6,.3,1) forwards}
    .trace{stroke-dasharray:18 12;animation:trace 16s linear infinite}
    .cube{transform-box:fill-box;transform-origin:center;animation:cube-float 8s ease-in-out infinite alternate}
    .glow{animation:glow 4s ease-in-out infinite}.scan{animation:scan 4s ease-in-out infinite}.float{animation:float 6s ease-in-out infinite}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3s ease-in-out infinite}
    @keyframes portrait-enter{from{opacity:0;filter:brightness(2)}to{opacity:.92;filter:brightness(1)}}
    @keyframes pixel-in{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:translateY(0)}}
    @keyframes name-rise{from{opacity:0;transform:translateY(115px) skewY(3deg)}to{opacity:1;transform:translateY(0) skewY(0)}}
    @keyframes reveal{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:translateY(0)}}
    @keyframes draw{to{stroke-dashoffset:0}}@keyframes trace{to{stroke-dashoffset:-360}}
    @keyframes cube-float{0%{transform:translate(0,0) rotate(-3deg)}100%{transform:translate(8px,-17px) rotate(6deg)}}
    @keyframes pulse{50%{opacity:.25;transform:scale(2.8)}}
    @keyframes glow{50%{opacity:.3}}@keyframes scan{0%,100%{transform:translateY(0)}50%{transform:translateY(125px)}}@keyframes float{50%{transform:translateY(-7px)}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;stroke-dashoffset:0!important;opacity:1!important}}
    </style><rect x="0" y="0" width="1200" height="365" rx="0" fill="#080A0B" stroke="none" /><text x="32" y="34" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="13" font-weight="700" letter-spacing="2" fill="#D7B54A" >MA  /  TITANIUMFEATHER</text><text x="1168" y="34" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="12" font-weight="500" letter-spacing="1" fill="#A3A39A" text-anchor="end">THE HUMAN ELEMENT   /   01</text><path d="M32 49 H1168" fill="none" stroke="#293034" stroke-width="1" /><text x="40" y="120" font-family="'Arial Narrow',Impact,'DejaVu Sans',sans-serif" font-size="65" font-weight="800" letter-spacing="-2" fill="#F1EEE5" >A little bit of</text><text x="40" y="201" font-family="'Arial Narrow',Impact,'DejaVu Sans',sans-serif" font-size="85" font-weight="800" letter-spacing="-3" fill="#D7B54A" >everything.</text><text x="43" y="273" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="15" font-weight="600" letter-spacing="1.5" fill="#19A9D1" >ALWAYS CURIOUS. ALWAYS BUILDING.</text><path d="M645 83 V320" fill="none" stroke="#293034" stroke-width="1" /><text x="680" y="111" font-family="'Arial Narrow',Impact,'DejaVu Sans',sans-serif" font-size="21" font-weight="400" letter-spacing="0" fill="#F1EEE5" >I&#x27;m Muhammed, a Computer Science student</text><text x="680" y="143" font-family="'Arial Narrow',Impact,'DejaVu Sans',sans-serif" font-size="21" font-weight="400" letter-spacing="0" fill="#F1EEE5" >at the University of Toronto.</text><text x="680" y="193" font-family="'Arial Narrow',Impact,'DejaVu Sans',sans-serif" font-size="20" font-weight="400" letter-spacing="0" fill="#A3A39A" >Some days I build operating systems.</text><text x="680" y="225" font-family="'Arial Narrow',Impact,'DejaVu Sans',sans-serif" font-size="20" font-weight="400" letter-spacing="0" fill="#A3A39A" >Other days I experiment with AI,</text><text x="680" y="257" font-family="'Arial Narrow',Impact,'DejaVu Sans',sans-serif" font-size="20" font-weight="400" letter-spacing="0" fill="#A3A39A" >design interfaces, or take things apart</text><text x="680" y="289" font-family="'Arial Narrow',Impact,'DejaVu Sans',sans-serif" font-size="20" font-weight="400" letter-spacing="0" fill="#A3A39A" >just to understand how they work.</text><text x="680" y="332" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="12" font-weight="500" letter-spacing="1.4" fill="#D7B54A" >SYSTEMS   /   INTELLIGENCE   /   DESIGN</text></svg>