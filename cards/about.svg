<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 270" width="1200" height="270" role="img" aria-label="about.svg"><style>
    .ascii-row{opacity:0;animation:ascii-in .2s steps(2,end) both} @keyframes ascii-in{from{opacity:0}to{opacity:.94}}
    .reveal{animation:reveal .85s cubic-bezier(.2,.75,.2,1) both}.draw{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 2.6s ease forwards}.glow{animation:glow 4s ease-in-out infinite}.scan{animation:scan 4s ease-in-out infinite}.float{animation:float 6s ease-in-out infinite}
    @keyframes reveal{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}@keyframes draw{to{stroke-dashoffset:0}}@keyframes glow{50%{opacity:.3}}@keyframes scan{0%,100%{transform:translateY(0)}50%{transform:translateY(125px)}}@keyframes float{50%{transform:translateY(-7px)}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;stroke-dashoffset:0!important;opacity:1!important}}
    </style><rect x="0" y="0" width="1200" height="270" rx="0" fill="#080A0B" stroke="none" /><text x="32" y="34" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="13" font-weight="700" letter-spacing="2" fill="#D7B54A" >MA  /  TITANIUMFEATHER</text><text x="1168" y="34" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="12" font-weight="500" letter-spacing="1" fill="#A3A39A" text-anchor="end">THE PERSON BEHIND THE CODE   /   01</text><path d="M32 49 H1168" fill="none" stroke="#293034" stroke-width="1" /><text x="40" y="115" font-family="'Arial Narrow',Impact,'DejaVu Sans',sans-serif" font-size="63" font-weight="700" letter-spacing="-2" fill="#F1EEE5" >Curiosity is the</text><text x="40" y="190" font-family="'Arial Narrow',Impact,'DejaVu Sans',sans-serif" font-size="78" font-weight="800" letter-spacing="-3" fill="#D7B54A" >whole point.</text><path d="M655 83 V216" fill="none" stroke="#293034" stroke-width="1" /><text x="690" y="105" font-family="'Arial Narrow',Impact,'DejaVu Sans',sans-serif" font-size="20" font-weight="400" letter-spacing="0" fill="#F1EEE5" >I study computer science at the University of Toronto.</text><text x="690" y="145" font-family="'Arial Narrow',Impact,'DejaVu Sans',sans-serif" font-size="20" font-weight="400" letter-spacing="0" fill="#A3A39A" >I like building at the intersection of systems,</text><text x="690" y="180" font-family="'Arial Narrow',Impact,'DejaVu Sans',sans-serif" font-size="20" font-weight="400" letter-spacing="0" fill="#A3A39A" >intelligence, and things people actually use.</text><text x="690" y="226" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="12" font-weight="500" letter-spacing="2" fill="#19A9D1" >LESS TALK. MORE THINGS THAT WORK.</text></svg>