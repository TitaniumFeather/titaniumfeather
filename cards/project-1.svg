<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 365" width="1200" height="365" role="img" aria-label="project-1.svg"><style>
    .portrait-appear{animation:portrait-enter 1.6s ease-out both}.ascii-pixel{opacity:0;animation:pixel-in .45s steps(2,end) both}
    .hero-name{animation:name-rise 1.25s cubic-bezier(.16,1,.3,1) both}
    .reveal{animation:reveal 1.05s cubic-bezier(.2,.75,.2,1) both}
    .draw{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 3.2s cubic-bezier(.3,.6,.3,1) forwards}
    .trace{stroke-dasharray:18 12;animation:trace 16s linear infinite}
    .cube{transform-box:fill-box;transform-origin:center;animation:cube-float 8s ease-in-out infinite alternate}
    .glow{animation:glow 4s ease-in-out infinite}.scan{animation:scan 4s ease-in-out infinite}.float{animation:float 6s ease-in-out infinite}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3s ease-in-out infinite}
    @keyframes portrait-enter{from{opacity:0;filter:brightness(2)}to{opacity:.92;filter:brightness(1)}}
    @keyframes pixel-in{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:translateY(0)}}
    @keyframes name-rise{from{opacity:0;transform:translateY(115px) skewY(3deg)}to{opacity:1;transform:translateY(0) skewY(0)}}
    @keyframes reveal{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:translateY(0)}}
    @keyframes draw{to{stroke-dashoffset:0}}@keyframes trace{to{stroke-dashoffset:-360}}
    @keyframes cube-float{0%{transform:translate(0,0) rotate(-3deg)}100%{transform:translate(8px,-17px) rotate(6deg)}}
    @keyframes pulse{50%{opacity:.25;transform:scale(2.8)}}
    @keyframes glow{50%{opacity:.3}}@keyframes scan{0%,100%{transform:translateY(0)}50%{transform:translateY(125px)}}@keyframes float{50%{transform:translateY(-7px)}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;stroke-dashoffset:0!important;opacity:1!important}}
    </style><rect x="0" y="0" width="1200" height="365" rx="0" fill="#080A0B" stroke="none" /><rect x="16" y="8" width="1168" height="349" rx="12" fill="#101415" stroke="#293034" /><text x="44" y="56" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="13" font-weight="600" letter-spacing="2" fill="#D7B54A" >01 / SYSTEMS</text><g class="reveal" style="animation-delay:.1s"><text x="42" y="135" font-family="'Arial Narrow',Impact,'DejaVu Sans',sans-serif" font-size="56" font-weight="800" letter-spacing="-2" fill="#F1EEE5" >LunaraOS</text></g><text x="45" y="186" font-family="'Arial Narrow',Impact,'DejaVu Sans',sans-serif" font-size="18" font-weight="400" letter-spacing="0" fill="#A3A39A" >An operating system, reimagined around the person using it.</text><path d="M45 225 H555" fill="none" stroke="#293034" stroke-width="1" /><text x="45" y="265" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="13" font-weight="500" letter-spacing="1" fill="#19A9D1" >LINUX / C++ / PYTHON</text><text x="45" y="321" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="15" font-weight="600" letter-spacing="1" fill="#D7B54A" >EXPLORE PROJECT  ↗</text><g class="reveal" style="animation-delay:.35s"><rect x="650" y="83" width="475" height="228" rx="10" fill="#0B1519" stroke="#19A9D1" /><rect x="666" y="103" width="443" height="29" rx="4" fill="#15242B" stroke="none" /><circle cx="685" cy="117" r="4" fill="#D7B54A"/><circle cx="699" cy="117" r="4" fill="#19A9D1"/><circle cx="713" cy="117" r="4" fill="#A3A39A"/><rect x="666" y="146" width="105" height="150" rx="4" fill="#10232B" stroke="none" /><rect x="784" y="146" width="325" height="150" rx="4" fill="#11191B" stroke="none" /><text x="803" y="176" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="13" font-weight="500" letter-spacing="0" fill="#19A9D1" >lunara / workspace</text><rect x="806" y="196" width="77" height="72" rx="4" fill="#18323B" stroke="#293034" /><rect x="899" y="196" width="77" height="72" rx="4" fill="#18323B" stroke="#19A9D1" /><rect x="992" y="196" width="77" height="72" rx="4" fill="#18323B" stroke="#293034" /><path d="M841 196 V268 M806 231 H883" fill="none" stroke="#D7B54A" stroke-width="1.5" class="draw"/></g></svg>