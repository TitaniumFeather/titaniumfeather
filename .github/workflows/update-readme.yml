name: Update Titanium OS profile
on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'
  push:
    paths:
      - 'config.json'
      - 'scripts/**'
      - '.github/workflows/update-readme.yml'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch GitHub data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_github_data.py
      - name: Render SVG cards
        run: python scripts/render_cards.py
      - name: Commit updated artwork
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cards/ data/contributions.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh Titanium OS profile cards'
            git push
          fi
